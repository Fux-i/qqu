name: mpmc_scaling_full
description: Full MPMC scaling benchmark

system:
  performance_mode: true
  producer_cpus: [2, 4, 6]
  consumer_cpus: [8, 10]

build:
  target: qqu_bench_mpmc

matrix:
  producer_counts: [1, 2, 3]

benchmark:
  element_types: [u32, u64, p16, p64]
  capacities: [256, 1024]
  runs: 15
  messages: 1000000
  queues: default

output:
  base: results
