name: mpmc_quick
description: Quick MPMC test (2 producers only)

system:
  performance_mode: false
  producer_cpus: [2, 4]
  consumer_cpus: [10]

build:
  target: qqu_bench_mpmc

matrix:
  producer_counts: [2]

benchmark:
  element_types: [u32]
  capacities: [1024]
  runs: 1
  messages: 10000
  queues: default

output:
  base: results
