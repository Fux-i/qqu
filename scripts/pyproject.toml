[project]
name = "qqu-benchmark"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.10",
    "pandas>=2.2",
    "pyyaml>=6.0",
]

[project.scripts]
qqu = "lib.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lib*"]
