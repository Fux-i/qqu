name: mpsc_scaling_full
description: MPSC multi-producer scaling (full mode)

system:
  performance_mode: true
  producer_cpus: [2, 4, 6, 8]
  consumer_cpu: 10

build:
  target: qqu_bench_mpsc

matrix:
  producer_counts: [1, 2, 3, 4]

benchmark:
  element_types: [u32, u64, p16, p64]
  capacities: [256, 512, 1024, 2048]
  runs: 15
  messages: 1000000
  queues: []

output:
  base: results
